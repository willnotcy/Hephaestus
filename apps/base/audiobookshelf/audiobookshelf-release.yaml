apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app audiobookshelf
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      audiobookshelf:
        containers:
          app:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.36.0
            env:
              - name: TZ
                value: Europe/Copenhagen
              - name: AUDIOBOOKSHELF_UID
                value: "1000"
              - name: AUDIOBOOKSHELF_GID
                value: "1000"
              - name: METADATA_PATH
                value: /config/metadata
              - name: CACHE_PATH
                value: /cache                
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: &port 80
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5

    service:
      app:
        controller: audiobookshelf
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

      audiobooks:
        type: nfs
        server: nfs.markmk.com
        path: /media/audiobooks
        globalMounts:
          - path: /audiobooks
            readOnly: true

      podcasts:
        type: nfs
        server: nfs.markmk.com
        path: /media/podcasts
        globalMounts:
          - path: /podcasts        

      cache:
        type: emptyDir
        globalMounts:
          - path: /cache        